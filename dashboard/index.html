<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAT WORK SPACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.65);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .split-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        .left-panel {
            flex: 1.2;
            background: var(--bg) url('fabric_rolls_bg.webp') no-repeat center;
            background-size: cover;
            position: relative;
        }

        /* Subtle gradient overlay to tie image to the UI theme */
        .left-panel::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to left, rgba(15, 23, 42, 0) 40%, rgba(15, 23, 42, 1) 100%);
            pointer-events: none;
        }

        .right-panel {
            width: 500px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            z-index: 10;
        }

        .header {
            text-align: left;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--muted);
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin: auto 0;
        }

        .card {
            width: 100%;
            height: 180px;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 24px;
            gap: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(56, 189, 248, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
        }

        .card:hover::before {
            transform: translateX(100%);
        }

        .icon {
            font-size: 55px;
            transition: transform 0.4s;
            flex-shrink: 0;
        }

        .card:hover .icon {
            transform: scale(1.1);
        }

        .card-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            flex: 1;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-desc {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .btn-link {
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-weight: 600;
            font-size: 0.8rem;
            border: 1px solid transparent;
            transition: all 0.3s;
        }

        .card:hover .btn-link {
            background: var(--accent);
            color: var(--bg);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 15px;
            font-size: 0.7rem;
            color: var(--muted);
            opacity: 0.5;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px #22c55e;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px;
            text-align: center;
            transform: translateY(0) scale(1);
            transition: all 0.3s;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            color: #f8fafc;
        }
        .modal-overlay.hidden .modal {
            transform: translateY(20px) scale(0.95);
        }
        .profile-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 40px;
            border-radius: 18px;
            text-decoration: none;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.05);
            min-width: 180px;
        }
        .profile-btn:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.1);
        }
        .milton-btn:hover {
            border-color: #38bdf8;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.15);
        }
        .vester-btn:hover {
            border-color: #e11d48;
            box-shadow: 0 10px 20px rgba(225, 29, 72, 0.15);
        }
        .profile-btn h3 { margin: 15px 0 5px; font-size: 1.2rem; }
        .profile-btn p { font-size: 0.8rem; color: var(--muted); }

        /* Responsive Layout */
        @media (max-width: 992px) {
            .split-container {
                flex-direction: column;
            }
            .left-panel {
                flex: 1;
                min-height: 40vh;
            }
            .right-panel {
                width: 100%;
                flex: 1.5;
                min-height: 60vh;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                padding: 30px;
            }
            .grid {
                margin: 20px 0;
            }
        }
    </style>
</head>
<body>
    <div class="split-container">
        <!-- Workspace tools stacked one by one (now on the left) -->
        <div class="right-panel">
            <div class="header">
                <h1>MAT</h1>
                <p>WORKSPACE</p>
            </div>

            <div class="grid">
                <div class="card" id="card-envelope">
                    <div class="card-content">
                        <div class="card-title">Envelope Pro</div>
                        <div class="card-desc">Advanced envelope printing and contact management system.</div>
                        <div class="btn-link">LAUNCH APP</div>
                    </div>
                    <div class="icon">✉️</div>
                </div>

                <a href="/stock/" class="card" id="card-stock">
                    <div class="card-content">
                        <div class="card-title">Stock Manager</div>
                        <div class="card-desc">Efficient garment inventory tracking and sales reports.</div>
                        <div class="btn-link">LAUNCH APP</div>
                    </div>
                    <div class="icon">📦</div>
                </a>
            </div>

            <div class="footer">
                <div class="status">
                    <div class="status-dot"></div>
                    <span>System Online</span>
                </div>
                <div>v2.1.0 (Cloud)</div>
            </div>
        </div>

        <!-- Full image view (now on the right) -->
        <div class="left-panel"></div>
    </div>

    <!-- Profile Selection Modal -->
    <div id="profile-modal" class="modal-overlay hidden">
        <div class="modal">
            <h2 style="margin-bottom: 30px; font-family: 'Playfair Display', serif; font-size: 2rem;">Select Address Book</h2>
            <div style="display: flex; gap: 20px; justify-content: center;">
                <a href="/envelope/?profile=1" class="profile-btn milton-btn">
                    <span style="font-size: 2.5rem;">🏢</span>
                    <h3>MILTON</h3>
                </a>
                <a href="/envelope/?profile=2" class="profile-btn vester-btn">
                    <span style="font-size: 2.5rem;">🏭</span>
                    <h3>VESTER</h3>
                </a>
            </div>
            <button id="close-modal" style="margin-top: 30px; padding: 10px 20px; background: transparent; border: 1px solid var(--muted); color: var(--muted); border-radius: 8px; cursor: pointer; transition: all 0.2s;">Cancel</button>
        </div>
    </div>

    <script>
        const cardEnvelope = document.getElementById('card-envelope');
        const profileModal = document.getElementById('profile-modal');
        const closeModal = document.getElementById('close-modal');

        cardEnvelope.addEventListener('click', (e) => {
            e.preventDefault();
            profileModal.classList.remove('hidden');
        });

        closeModal.addEventListener('click', () => {
            profileModal.classList.add('hidden');
        });

        closeModal.addEventListener('mouseover', () => closeModal.style.color = 'white');
        closeModal.addEventListener('mouseout', () => closeModal.style.color = 'var(--muted)');

        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) profileModal.classList.add('hidden');
        });

        async function checkStatus() {
            const statusDot = document.querySelector('.status-dot');
            const statusText = document.querySelector('.status span');
            try {
                const res = await fetch('/api/envelope/status');
                const data = await res.json();
                if (data.status === 'online') {
                    statusDot.style.background = '#22c55e';
                    statusDot.style.boxShadow = '0 0 10px #22c55e';
                    statusText.textContent = `System Online`;
                }
            } catch (e) {
                statusDot.style.background = '#ef4444';
                statusDot.style.boxShadow = '0 0 10px #ef4444';
                statusText.textContent = `System Offline / Searching...`;
            }
        }
        checkStatus();
        setInterval(checkStatus, 5000);
    </script>
</body>
</html>
