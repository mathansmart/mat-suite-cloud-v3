<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAT Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(30, 41, 59, 0.4) 0px, transparent 50%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 4px;
            background: linear-gradient(to right, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .header p {
            color: var(--muted);
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .grid {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            padding: 40px;
        }

        .card {
            width: 350px;
            height: 450px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent, rgba(56, 189, 248, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .card:hover {
            transform: translateY(-15px) scale(1.02);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px var(--accent-glow);
        }

        .card:hover::before {
            transform: translateX(100%);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 30px;
            transition: transform 0.4s;
        }

        .card:hover .icon {
            transform: scale(1.1);
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .card-desc {
            color: var(--muted);
            text-align: center;
            padding: 0 30px;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .footer {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            color: var(--muted);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .btn-link {
            padding: 12px 24px;
            border-radius: 12px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-weight: 600;
            margin-top: 30px;
            border: 1px solid transparent;
            transition: all 0.3s;
        }

        .card:hover .btn-link {
            background: var(--accent);
            color: var(--bg);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 1;
            transition: opacity 0.3s;
        }
        .modal-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .modal {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            transform: translateY(0) scale(1);
            transition: all 0.3s;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .modal-overlay.hidden .modal {
            transform: translateY(20px) scale(0.95);
        }
        .profile-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 40px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
            background: rgba(15, 23, 42, 0.5);
            min-width: 180px;
        }
        .profile-btn:hover {
            transform: translateY(-5px);
        }
        .milton-btn:hover {
            border-color: #38bdf8;
            box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2);
        }
        .vester-btn:hover {
            border-color: #f43f5e;
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.2);
        }
        .profile-btn h3 { margin: 15px 0 5px; font-size: 1.2rem; }
        .profile-btn p { font-size: 0.8rem; color: var(--muted); }
    </style>
</head>
<body>
    <div class="header">
        <h1>MAT</h1>
        <p>Workspace</p>
    </div>

    <div class="grid">
        <div class="card" id="card-envelope">
            <div class="icon">✉️</div>
            <div class="card-title">Envelope Pro</div>
            <div class="card-desc">Advanced envelope printing and contact management system.</div>
            <div class="btn-link">LAUNCH APP</div>
        </div>

        <a href="/stock/" class="card" id="card-stock">
            <div class="icon">📦</div>
            <div class="card-title">Stock Manager</div>
            <div class="card-desc">Efficient garment inventory tracking and sales reports.</div>
            <div class="btn-link">LAUNCH APP</div>
        </a>
    </div>

    <div class="footer">
        <div class="status">
            <div class="status-dot"></div>
            <span>System Online</span>
        </div>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div>v2.1.0 (Cloud)</div>
        </div>
    </div>

    <!-- Profile Selection Modal -->
    <div id="profile-modal" class="modal-overlay hidden">
        <div class="modal">
            <h2 style="margin-bottom: 30px; font-family: 'Playfair Display', serif; font-size: 2rem;">Select Address Book</h2>
            <div style="display: flex; gap: 20px; justify-content: center;">
                <a href="/envelope/?profile=1" class="profile-btn milton-btn">
                    <span style="font-size: 2.5rem;">🏢</span>
                    <h3>MILTON</h3>
                </a>
                <a href="/envelope/?profile=2" class="profile-btn vester-btn">
                    <span style="font-size: 2.5rem;">🏭</span>
                    <h3>VESTER</h3>
                </a>
            </div>
            <button id="close-modal" style="margin-top: 30px; padding: 10px 20px; background: transparent; border: 1px solid var(--muted); color: var(--muted); border-radius: 8px; cursor: pointer; transition: all 0.2s;">Cancel</button>
        </div>
    </div>

    <script>
        const cardEnvelope = document.getElementById('card-envelope');
        const profileModal = document.getElementById('profile-modal');
        const closeModal = document.getElementById('close-modal');

        cardEnvelope.addEventListener('click', (e) => {
            e.preventDefault();
            profileModal.classList.remove('hidden');
        });

        closeModal.addEventListener('click', () => {
            profileModal.classList.add('hidden');
        });

        closeModal.addEventListener('mouseover', () => closeModal.style.color = 'white');
        closeModal.addEventListener('mouseout', () => closeModal.style.color = 'var(--muted)');

        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) profileModal.classList.add('hidden');
        });

        async function checkStatus() {
            const statusDot = document.querySelector('.status-dot');
            const statusText = document.querySelector('.status span');
            try {
                const res = await fetch('/api/envelope/status');
                const data = await res.json();
                if (data.status === 'online') {
                    statusDot.style.background = '#22c55e';
                    statusDot.style.boxShadow = '0 0 10px #22c55e';
                    statusText.textContent = `System Online: ${data.ip}:3001`;
                }
            } catch (e) {
                statusDot.style.background = '#ef4444';
                statusDot.style.boxShadow = '0 0 10px #ef4444';
                statusText.textContent = `System Offline / Searching...`;
            }
        }
        checkStatus();
        setInterval(checkStatus, 5000);
    </script>
</body>
</html>
